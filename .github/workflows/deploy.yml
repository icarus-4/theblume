name: Deploy to AWS

# Builds the site (with prerendering) and publishes it to S3 + CloudFront.
# Authentication uses GitHub OIDC: no AWS keys are stored in this repo.
# The role can only write to the theBlume bucket and refresh its CDN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject and no longer
    # match the role's trust policy (repo:icarus-4/theblume:ref:refs/heads/main).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # vite build + server render + per-page HTML, sitemap, robots.txt, llms.txt
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: bash scripts/deploy-aws.sh
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
